<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Knowledge Base</title>
    <style>
        /* ========== 设计系统：编辑级极简主义 ========== */
        :root {
            /* 色彩：暖白 + 深灰 + 单一强调色 */
            --color-bg: #fafaf9;
            --color-card: #ffffff;
            --color-border: #e5e5e4;
            --color-border-strong: #d4d4d2;
            --color-text: #1c1917;
            --color-text-secondary: #57534e;
            --color-text-muted: #a8a29e;
            --color-accent: #0d9488;
            --color-accent-hover: #0f766e;
            --color-accent-subtle: #f0fdfa;
            --color-tag-bg: #f5f5f4;
            --color-tag-text: #44403c;
            --color-score-high: #059669;
            --color-score-mid: #d97706;
            --color-score-low: #dc2626;

            /* 阴影：微妙、自然 */
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);

            /* 圆角：适中、不夸张 */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;

            /* 间距：8px 基准 */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;

            /* 字体 */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;

            /* 过渡 */
            --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ========== 基础重置 ========== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            font-size: 0.9375rem;
            line-height: 1.6;
            color: var(--color-text);
            background-color: var(--color-bg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========== 顶部导航 ========== */
        .header {
            background-color: var(--color-card);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-5) var(--space-4);
        }

        .header-container {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .header-logo {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            background-color: var(--color-accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
        }

        .header-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--color-text);
            letter-spacing: -0.01em;
        }

        .header-subtitle {
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
            margin-top: 1px;
        }

        .header-stats {
            display: flex;
            gap: var(--space-6);
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
        }

        .header-stat {
            display: flex;
            align-items: baseline;
            gap: var(--space-1);
        }

        .header-stat-value {
            font-weight: 600;
            color: var(--color-text);
            font-variant-numeric: tabular-nums;
        }

        /* ========== 主内容区 ========== */
        .main {
            max-width: 1080px;
            margin: 0 auto;
            padding: var(--space-8) var(--space-4);
        }

        /* ========== 搜索区 ========== */
        .search-section {
            margin-bottom: var(--space-8);
        }

        .search-box {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            font-size: 0.9375rem;
            font-family: inherit;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: var(--color-card);
            color: var(--color-text);
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }

        .search-input::placeholder {
            color: var(--color-text-muted);
        }

        .search-input:hover {
            border-color: var(--color-border-strong);
        }

        .search-input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
            font-size: 15px;
            pointer-events: none;
        }

        .search-button {
            padding: 10px 20px;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: inherit;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: var(--color-card);
            color: var(--color-text);
            cursor: pointer;
            transition: all var(--transition);
        }

        .search-button:hover {
            background-color: var(--color-bg);
            border-color: var(--color-border-strong);
        }

        .search-button.primary {
            background-color: var(--color-accent);
            border-color: var(--color-accent);
            color: white;
        }

        .search-button.primary:hover {
            background-color: var(--color-accent-hover);
            border-color: var(--color-accent-hover);
        }

        /* ========== 过滤栏 ========== */
        .filter-bar {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
            align-items: center;
            padding: var(--space-3) var(--space-4);
            background-color: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .filter-label {
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
            font-weight: 500;
        }

        .filter-select {
            padding: 6px 10px;
            font-size: 0.8125rem;
            font-family: inherit;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background-color: var(--color-card);
            color: var(--color-text);
            cursor: pointer;
            transition: border-color var(--transition);
            outline: none;
        }

        .filter-select:hover {
            border-color: var(--color-border-strong);
        }

        .filter-select:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.1);
        }

        .stats {
            margin-left: auto;
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
        }

        .stats-count {
            font-weight: 600;
            color: var(--color-accent);
            font-variant-numeric: tabular-nums;
        }

        /* ========== 结果列表 ========== */
        .results {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        /* ========== 项目卡片 ========== */
        .card {
            background-color: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .card:hover {
            border-color: var(--color-border-strong);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-2);
            gap: var(--space-3);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .card-title a {
            color: var(--color-text);
            text-decoration: none;
            transition: color var(--transition);
        }

        .card-title a:hover {
            color: var(--color-accent);
        }

        .card-score {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .card-score.high {
            background-color: #ecfdf5;
            color: var(--color-score-high);
        }

        .card-score.mid {
            background-color: #fffbeb;
            color: var(--color-score-mid);
        }

        .card-score.low {
            background-color: #fef2f2;
            color: var(--color-score-low);
        }

        .card-description {
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            margin-bottom: var(--space-3);
            line-height: 1.5;
        }

        .card-summary {
            font-size: 0.875rem;
            margin-bottom: var(--space-3);
            padding: var(--space-3);
            background-color: var(--color-accent-subtle);
            border-left: 3px solid var(--color-accent);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            line-height: 1.6;
        }

        .card-summary-label {
            font-size: 0.6875rem;
            color: var(--color-accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-1);
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-4);
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-3);
        }

        .card-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-1);
            margin-bottom: var(--space-3);
        }

        .tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            background-color: var(--color-tag-bg);
            color: var(--color-tag-text);
            border-radius: 12px;
            border: 1px solid var(--color-border);
        }

        .tag.use-case {
            background-color: #fffbeb;
            color: #92400e;
            border-color: #fde68a;
        }

        .card-actions {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        .action-button {
            font-size: 0.8125rem;
            padding: 5px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background-color: var(--color-card);
            color: var(--color-text-secondary);
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .action-button:hover {
            background-color: var(--color-bg);
            color: var(--color-text);
            border-color: var(--color-border-strong);
        }

        .action-button.deepwiki {
            color: #0369a1;
            border-color: #bae6fd;
        }

        .action-button.deepwiki:hover {
            background-color: #f0f9ff;
            border-color: #7dd3fc;
        }

        .action-button.zread {
            color: #059669;
            border-color: #a7f3d0;
        }

        .action-button.zread:hover {
            background-color: #ecfdf5;
            border-color: #6ee7b7;
        }

        /* ========== 状态提示 ========== */
        .status {
            text-align: center;
            padding: var(--space-12);
            color: var(--color-text-secondary);
            font-size: 0.875rem;
        }

        .status.error {
            color: var(--color-score-low);
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: var(--space-2);
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== 分页 ========== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--space-3);
            margin-top: var(--space-8);
        }

        .pagination button {
            padding: 8px 16px;
            font-size: 0.8125rem;
            font-weight: 500;
            font-family: inherit;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background-color: var(--color-card);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }

        .pagination button:hover:not(:disabled) {
            background-color: var(--color-bg);
            color: var(--color-text);
            border-color: var(--color-border-strong);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination-info {
            font-size: 0.8125rem;
            color: var(--color-text-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* ========== 页脚 ========== */
        .footer {
            text-align: center;
            padding: var(--space-8);
            color: var(--color-text-muted);
            font-size: 0.8125rem;
            border-top: 1px solid var(--color-border);
            margin-top: var(--space-12);
        }

        .footer a {
            color: var(--color-accent);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-stats {
                width: 100%;
                justify-content: space-between;
            }

            .search-box {
                flex-direction: column;
            }

            .search-button {
                width: 100%;
            }

            .filter-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                margin-left: 0;
            }

            .card-header {
                flex-direction: column;
            }

            .card-score {
                align-self: flex-start;
            }
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-border-strong);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-muted);
        }

        /* ========== 选中文字 ========== */
        ::selection {
            background-color: rgba(13, 148, 136, 0.15);
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-container">
            <div class="header-brand">
                <div class="header-logo">★</div>
                <div>
                    <div class="header-title">Star Knowledge Base</div>
                    <div class="header-subtitle">让你的 GitHub Stars 从收藏夹变成 agent 可检索的个人代码工具箱</div>
                </div>
            </div>
            <div class="header-stats">
                <div class="header-stat">
                    <span>项目总数</span>
                    <span class="header-stat-value" id="totalCount">-</span>
                </div>
                <div class="header-stat">
                    <span>语言</span>
                    <span class="header-stat-value" id="langCount">-</span>
                </div>
                <div class="header-stat">
                    <span>更新时间</span>
                    <span class="header-stat-value" id="updateTime">-</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
        <!-- 搜索区 -->
        <section class="search-section">
            <div class="search-box">
                <div class="search-input-wrapper">
                    <span class="search-icon">⌕</span>
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="输入关键词、技术栈、场景（例如：实时聊天、文件上传、ORM）"
                        autocomplete="off"
                    >
                </div>
                <button id="searchButton" class="search-button primary">搜索</button>
                <button id="resetButton" class="search-button">重置</button>
            </div>

            <div class="filter-bar">
                <div class="filter-group">
                    <span class="filter-label">语言</span>
                    <select id="languageFilter" class="filter-select">
                        <option value="">全部</option>
                    </select>
                </div>

                <div class="filter-group">
                    <span class="filter-label">排序</span>
                    <select id="sortBy" class="filter-select">
                        <option value="starred_at-desc">最近 star</option>
                        <option value="stargazers_count-desc">Star 数（高→低）</option>
                        <option value="stargazers_count-asc">Star 数（低→高）</option>
                        <option value="quality_score-desc">质量评分（高→低）</option>
                        <option value="pushed_at-desc">最近更新</option>
                    </select>
                </div>

                <div class="stats">
                    <span>共 <span class="stats-count" id="statsCount">0</span> 个项目</span>
                    <span id="pageInfo"></span>
                </div>
            </div>
        </section>

        <!-- 结果列表 -->
        <div id="results" class="results"></div>
        <div id="status" class="status"></div>
        <div id="pagination" class="pagination" style="display: none;"></div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <p>Powered by <a href="https://docs.github.com/en/pages" target="_blank" rel="noopener">GitHub Pages</a>
            · 数据由 GitHub Actions 每日同步
            · <a href="https://modelcontextprotocol.io" target="_blank" rel="noopener">MCP</a> agent 可接入</p>
    </footer>

    <script>
        /**
         * Star Knowledge Base 前端搜索逻辑
         *
         * 设计原则:
         *   - Vanilla JS，零依赖，零构建步骤
         *   - 客户端全量过滤与排序，无需后端
         *   - data.json 加载后缓存在内存，避免重复请求
         *
         * author: fxbin
         */

        // 常量定义（禁止魔法值）
        const DATA_URL = './data.json';
        const PAGE_SIZE = 20;
        const MIN_QUERY_LENGTH = 1;
        const HIGH_SCORE_THRESHOLD = 4;
        const LOW_SCORE_THRESHOLD = 2;

        // 全局状态
        const state = {
            allEntries: [],
            filteredEntries: [],
            currentPage: 1,
            languages: new Set(),
            isLoading: false,
        };

        // DOM 引用
        const dom = {
            searchInput: document.getElementById('searchInput'),
            searchButton: document.getElementById('searchButton'),
            resetButton: document.getElementById('resetButton'),
            languageFilter: document.getElementById('languageFilter'),
            sortBy: document.getElementById('sortBy'),
            statsCount: document.getElementById('statsCount'),
            pageInfo: document.getElementById('pageInfo'),
            results: document.getElementById('results'),
            status: document.getElementById('status'),
            pagination: document.getElementById('pagination'),
            totalCount: document.getElementById('totalCount'),
            langCount: document.getElementById('langCount'),
            updateTime: document.getElementById('updateTime'),
        };

        /**
         * 显示状态信息
         * @param {string} message - 消息内容
         * @param {boolean} isError - 是否为错误
         */
        function showStatus(message, isError = false) {
            dom.status.textContent = message;
            dom.status.className = isError ? 'status error' : 'status';
            dom.status.style.display = message ? 'block' : 'none';
        }

        /**
         * 显示加载中状态
         * @param {string} message - 加载提示
         */
        function showLoading(message) {
            dom.status.innerHTML = '<span class="loading"></span>' + message;
            dom.status.className = 'status';
            dom.status.style.display = 'block';
        }

        /**
         * 加载 data.json
         * 失败时显示错误并提示用户检查 Pages 是否已部署。
         */
        async function loadData() {
            showLoading('正在加载 star 数据...');
            try {
                const response = await fetch(DATA_URL, { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                state.allEntries = data.entries || [];
                state.languages = new Set(
                    state.allEntries
                        .map(entry => entry.language)
                        .filter(Boolean)
                        .sort()
                );
                populateLanguageFilter();
                updateHeaderStats(data);
                showStatus('');
                applyFilters();
            } catch (error) {
                showStatus('数据加载失败：' + error.message + '。请确认 GitHub Actions 已运行并部署到 Pages。', true);
                state.allEntries = [];
                dom.statsCount.textContent = '0';
            }
        }

        /**
         * 更新顶部统计信息
         */
        function updateHeaderStats(data) {
            dom.totalCount.textContent = data.total || state.allEntries.length;
            dom.langCount.textContent = state.languages.size;
            if (data.generated_at) {
                const date = new Date(data.generated_at);
                dom.updateTime.textContent = date.toLocaleDateString('zh-CN');
            }
        }

        /**
         * 填充语言过滤下拉框
         */
        function populateLanguageFilter() {
            const currentValue = dom.languageFilter.value;
            dom.languageFilter.innerHTML = '<option value="">全部</option>';
            state.languages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang;
                dom.languageFilter.appendChild(option);
            });
            dom.languageFilter.value = currentValue;
        }

        /**
         * 应用过滤与排序
         */
        function applyFilters() {
            const query = dom.searchInput.value.trim().toLowerCase();
            const language = dom.languageFilter.value;
            const [sortField, sortOrder] = dom.sortBy.value.split('-');

            let filtered = state.allEntries.slice();

            // 语言过滤
            if (language) {
                filtered = filtered.filter(entry => entry.language === language);
            }

            // 关键词过滤
            if (query.length >= MIN_QUERY_LENGTH) {
                const tokens = query.split(/\s+/).filter(Boolean);
                filtered = filtered.filter(entry => {
                    const haystack = [
                        entry.full_name || '',
                        entry.description || '',
                        entry.summary || '',
                        entry.language || '',
                        (entry.topics || []).join(' '),
                        (entry.use_cases || []).join(' '),
                    ].join(' ').toLowerCase();
                    return tokens.every(token => haystack.includes(token));
                });
            }

            // 排序
            filtered.sort((a, b) => {
                let valueA = a[sortField];
                let valueB = b[sortField];
                if (typeof valueA === 'string') {
                    valueA = valueA.toLowerCase();
                    valueB = valueB.toLowerCase();
                }
                if (valueA < valueB) return sortOrder === 'asc' ? -1 : 1;
                if (valueA > valueB) return sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            state.filteredEntries = filtered;
            state.currentPage = 1;
            renderResults();
        }

        /**
         * 渲染结果列表
         */
        function renderResults() {
            const total = state.filteredEntries.length;
            const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
            if (state.currentPage > totalPages) {
                state.currentPage = totalPages;
            }
            const start = (state.currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const pageEntries = state.filteredEntries.slice(start, end);

            dom.statsCount.textContent = total;
            dom.pageInfo.textContent = total > 0 ? ` · 第 ${state.currentPage}/${totalPages} 页` : '';

            if (total === 0) {
                dom.results.innerHTML = '';
                showStatus('没有匹配的项目。试试其他关键词或重置过滤条件。');
                dom.pagination.style.display = 'none';
                return;
            }

            showStatus('');
            dom.results.innerHTML = pageEntries.map(entryToHtml).join('');
            renderPagination(totalPages);
        }

        /**
         * 渲染分页控件
         */
        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                dom.pagination.style.display = 'none';
                return;
            }
            dom.pagination.style.display = 'flex';
            dom.pagination.innerHTML = '';

            const prevButton = document.createElement('button');
            prevButton.textContent = '← 上一页';
            prevButton.disabled = state.currentPage === 1;
            prevButton.addEventListener('click', () => {
                state.currentPage--;
                renderResults();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            const nextButton = document.createElement('button');
            nextButton.textContent = '下一页 →';
            nextButton.disabled = state.currentPage === totalPages;
            nextButton.addEventListener('click', () => {
                state.currentPage++;
                renderResults();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            const pageInfo = document.createElement('span');
            pageInfo.className = 'pagination-info';
            pageInfo.textContent = `${state.currentPage} / ${totalPages}`;

            dom.pagination.appendChild(prevButton);
            dom.pagination.appendChild(pageInfo);
            dom.pagination.appendChild(nextButton);
        }

        /**
         * 把单个 entry 渲染为卡片 HTML
         */
        function entryToHtml(entry) {
            const scoreClass = entry.quality_score >= HIGH_SCORE_THRESHOLD ? 'high'
                : entry.quality_score >= LOW_SCORE_THRESHOLD ? 'mid'
                : 'low';
            const scoreLabel = `质量 ${entry.quality_score}/5`;

            const topics = (entry.topics || [])
                .slice(0, 10)
                .map(topic => `<span class="tag">${escapeHtml(topic)}</span>`)
                .join('');

            const useCases = (entry.use_cases || [])
                .slice(0, 5)
                .map(useCase => `<span class="tag use-case">${escapeHtml(useCase)}</span>`)
                .join('');

            const summaryBlock = entry.summary
                ? `<div class="card-summary">
                       <div class="card-summary-label">摘要</div>
                       ${escapeHtml(entry.summary)}
                   </div>`
                : '';

            return `
                <article class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <a href="${escapeHtml(entry.html_url)}" target="_blank" rel="noopener">
                                ${escapeHtml(entry.full_name)}
                            </a>
                        </div>
                        <span class="card-score ${scoreClass}">${scoreLabel}</span>
                    </div>
                    <p class="card-description">${escapeHtml(entry.description || '（无描述）')}</p>
                    ${summaryBlock}
                    <div class="card-meta">
                        ${entry.language ? `<span class="card-meta-item">${escapeHtml(entry.language)}</span>` : ''}
                        <span class="card-meta-item">★ ${entry.stargazers_count || 0}</span>
                        <span class="card-meta-item">⑂ ${entry.forks_count || 0}</span>
                        <span class="card-meta-item">更新 ${formatDate(entry.pushed_at)}</span>
                        <span class="card-meta-item">starred ${formatDate(entry.starred_at)}</span>
                    </div>
                    ${topics ? `<div class="card-tags">${topics}</div>` : ''}
                    ${useCases ? `<div class="card-tags">${useCases}</div>` : ''}
                    <div class="card-actions">
                        <a class="action-button" href="${escapeHtml(entry.html_url)}" target="_blank" rel="noopener">GitHub</a>
                        <a class="action-button deepwiki" href="${escapeHtml(entry.deepwiki_url)}" target="_blank" rel="noopener">DeepWiki</a>
                        <a class="action-button zread" href="${escapeHtml(entry.zread_url)}" target="_blank" rel="noopener">Zread</a>
                    </div>
                </article>
            `;
        }

        /**
         * HTML 转义，防止 XSS
         */
        function escapeHtml(text) {
            if (text == null) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        /**
         * 日期格式化
         */
        function formatDate(isoString) {
            if (!isoString) return '未知';
            try {
                const date = new Date(isoString);
                return date.toLocaleDateString('zh-CN');
            } catch {
                return isoString;
            }
        }

        // 事件绑定
        dom.searchButton.addEventListener('click', applyFilters);
        dom.resetButton.addEventListener('click', () => {
            dom.searchInput.value = '';
            dom.languageFilter.value = '';
            dom.sortBy.value = 'starred_at-desc';
            applyFilters();
        });
        dom.searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                applyFilters();
            }
        });
        dom.languageFilter.addEventListener('change', applyFilters);
        dom.sortBy.addEventListener('change', applyFilters);

        // 防抖搜索
        let debounceTimer = null;
        dom.searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(applyFilters, 300);
        });

        // 初始化
        loadData();
    </script>
</body>
</html>
